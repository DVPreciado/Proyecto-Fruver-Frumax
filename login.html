<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Iniciar sesión en FRUMAX">
    <title>Iniciar sesión | FRUMAX</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-white">

    <!-- Encabezado -->
    <header class="bg-white border-top border-success border-3 border-bottom sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light px-4 py-2">
            <div class="container-fluid px-0">

                <!-- Logo -->
                <a href="index.html">
                    <img src="assets/imag/proyecto.jpg" alt="Logo de la empresa" width="50" class="img-fluid">
                </a>

                <!-- Botón Hamburguesa Móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarFrumax"
                    aria-controls="navbarFrumax" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú de navegación y Botones -->
                <div class="collapse navbar-collapse" id="navbarFrumax">
                    
                    <!-- Menú Central (Inicio, Catálogo, Nosotros, Contacto) -->
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3 text-center">
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-semibold" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-semibold" href="#catalogo">Catálogo</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-dark fw-semibold" href="#" id="nosotrosDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Nosotros
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="nosotrosDropdown">
                                <li><a class="dropdown-item" href="#mision">Misión</a></li>
                                <li><a class="dropdown-item" href="#vision">Visión</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-semibold" href="#contacto">Contacto</a>
                        </li>
                    </ul>

                    <!-- Icono Carrito y Botones Derecho -->
                    <div class="d-flex align-items-center justify-content-center gap-3 mt-3 mt-lg-0">
                        <a href="#carrito" class="text-dark fs-5 p-1" aria-label="Carrito de compras">
                            <i class="bi bi-cart3"></i>

                        
                        </a>
                        <a href="login.html" class="btn btn-sm btn-outline-success fw-bold px-3 py-2">Iniciar sesión</a>
                        <a href="registro.html" class="btn btn-sm btn-success fw-bold px-3 py-2">Registrarse</a>
                    </div>

                </div>

            </div>
        </nav>
    </header>

    <!-- contenido principal-->
    <main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
        <div class="container d-flex flex-column align-items-center">

            <!-- Logo -->
                <a href="index.html">
                    <img src="assets/imag/proyecto.jpg" alt="Logo de la empresa" width="50" class="img-fluid">
                </a>

            <!-- Títulos -->
            <h1 class="h3 fw-bold text-center mb-1">Iniciar sesión</h1>
            <p class="text-secondary small text-center mb-4">Bienvenido de vuelta a Frumax</p>

            <!-- Tarjeta del Formulario (con max-width usando style en línea o clase de Bootstrap col-12 col-sm-10 col-md-6 col-lg-4) -->
            <div class="card shadow-sm p-4 bg-white rounded-4 border w-100" style="max-width: 420px;">
                <form action="#" method="POST">
                    
                    <!-- Campo Correo Electrónico -->
                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold small text-dark">Correo electrónico</label>
                        <input type="email" class="form-control form-control-lg fs-6" id="email" name="email" placeholder="tu@email.com" required>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold small text-dark">Contraseña</label>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <!-- Recordarme u Olvidaste contraseña -->
                    <div class="d-flex justify-content-between align-items-center mb-4 small">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label text-secondary" for="rememberMe">
                                Recordarme
                            </label>
                        </div>
                        <a href="#" class="text-success fw-semibold text-decoration-none">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Botón Entrar -->
                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-danger py-2 rounded-3 fw-bold fs-6">Entrar</button>
                    </div>

                    <!-- Link de registro abajo -->
                    <div class="text-center small text-secondary">
                        ¿No tienes cuenta? <a href="registro.html" class="text-success fw-semibold text-decoration-none">Regístrate gratis</a>
                    </div>

                </form>
            </div>

        </div>
    </main>

    <!-- pie de pagina-->
    <footer class="bg-white py-3 border-bottom border-success border-4"></footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
