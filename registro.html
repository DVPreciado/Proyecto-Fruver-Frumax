<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="FRUMAX - Crear cuenta">
    <title>FRUMAX | Crear cuenta</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-white">

    <!-- encabezado -->
    <header class="shadow-sm bg-white sticky-top border-top border-success border-3 border-bottom">
        <nav class="navbar navbar-expand-lg navbar-light py-2 px-4">
            <div class="container-fluid px-0">

                <!-- Logo  -->
                <a href="index.html">
                <img src="assets/imagenes/Logo.jpg" alt="Logo de la empresa" width="50" class="img-fluid">
                 </a>

                <!-- Botón Menú Hamburguesa para móviles -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain"
                    aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- Menú colapsable -->
                <div class="collapse navbar-collapse" id="navbarMain">

                    <!-- Enlaces principales -->
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-3 text-center">
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="assets/imagenes/Logo.jpg">Inicio</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Catálogo
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Frutas</a></li>
                                <li><a class="dropdown-item" href="#">Verduras</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle text-dark" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                Nosotros
                            </a>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="#">Nuestra Historia</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark" href="#">Contacto</a>
                        </li>
                    </ul>

                    <!-- Botones superiores derechos -->
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-3 mt-lg-0">
                        <a href="#" class="btn btn-link text-dark fs-5 p-1 me-2" aria-label="Carrito de compras">
                            <i class="bi bi-cart3"></i>
                        </a>
                        <a href="login.html" class="btn btn-outline-success btn-sm px-3 py-2 fw-semibold">Iniciar sesión</a>
                        <a href="register.html" class="btn btn-success btn-sm px-3 py-2 fw-semibold">Registrarse</a>
                    </div>

                </div>

            </div>
        </nav>
    </header>

    <!-- registro -->
    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-5">

                    <!-- Encabezado del Formulario -->
                    <div class="text-center mb-4">
                        <div class="d-inline-block mb-2">
                        <!-- Logo -->
                <a href="index.html">
                    <img src="assets/imag/proyecto.jpg" alt="Logo de la empresa" width="50" class="img-fluid">
                </a>
                        </div>
                
                        <h2 class="fw-bold text-dark mb-1">Crear cuenta</h2>
                        <p class="text-secondary small">Únete a miles de clientes de Frumax</p>
                    </div>

                    <!--  Formulario -->
                    <div class="card border border-light-subtle rounded-4 shadow-sm p-4">
                        <form>
                            <!-- Nombre completo -->
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold text-dark small mb-1">Nombre completo</label>
                                <input type="text" class="form-field form-control py-2 text-secondary" id="fullName" placeholder="María González" required>
                            </div>

                            <!-- Correo electrónico -->
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-dark small mb-1">Correo electrónico</label>
                                <input type="email" class="form-field form-control py-2 text-secondary" id="email" placeholder="tu@email.com" required>
                            </div>

                            <!-- Contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label fw-bold text-dark small mb-1">Contraseña</label>
                                <input type="password" class="form-field form-control py-2 text-secondary" id="password" placeholder="Mínimo 8 caracteres" required>
                            </div>

                            <!-- Confirmar contraseña -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label fw-bold text-dark small mb-1">Confirmar contraseña</label>
                                <input type="password" class="form-field form-control py-2 text-secondary" id="confirmPassword" placeholder="Repite tu contraseña" required>
                            </div>

                            <!-- Términos y Condiciones -->
                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label small text-secondary" for="terms">
                                    Acepto los <a href="#" class="text-success text-decoration-none fw-semibold">términos y condiciones</a> de Frumax
                                </label>
                            </div>

                            <!-- Botón Enviar -->
                            <button type="submit" class="btn btn-danger w-100 py-2 fw-bold text-white rounded-3 mb-3">
                                Crear mi cuenta
                            </button>

                            <!-- Enlace a Iniciar Sesión -->
                            <div class="text-center">
                                <small class="text-secondary">
                                    ¿Ya tienes cuenta? <a href="login.html" class="text-success text-decoration-none fw-semibold">Iniciar sesión</a>
                                </small>
                            </div>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JavaScript Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
